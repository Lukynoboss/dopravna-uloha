name: Hotová aplikácia

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  zostav:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            subor: DopravnaUloha-Windows.zip
          - os: macos-15
            subor: DopravnaUloha-Mac-Apple-M1-M4.zip
          - os: macos-15-intel
            subor: DopravnaUloha-Mac-Intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python test_metody.py
      - run: python -m PyInstaller --noconfirm --windowed --name DopravnaUloha --osx-bundle-identifier sk.dopravnauloha aplikacia.py
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/DopravnaUloha -DestinationPath ${{ matrix.subor }}
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/DopravnaUloha.app ${{ matrix.subor }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.subor }}
          path: ${{ matrix.subor }}

  vydaj:
    needs: zostav
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: DopravnaUloha-*.zip
          body: |
            Hotová aplikácia – netreba inštalovať Python. Stiahni súbor pre svoj systém, rozbaľ ho a spusti.

            - **Windows:** `DopravnaUloha-Windows.zip` → v priečinku spusti `DopravnaUloha.exe`. Ak sa objaví „Systém Windows ochránil počítač“, klikni **Ďalšie informácie → Spustiť aj tak**.
            - **Mac s čipom M1–M4:** `DopravnaUloha-Mac-Apple-M1-M4.zip`, **Mac s Intelom:** `DopravnaUloha-Mac-Intel.zip` → presuň `DopravnaUloha.app` do Aplikácií. Pri prvom spustení: pravým tlačidlom → **Otvoriť**, prípadne **Nastavenia systému → Súkromie a bezpečnosť → Napriek tomu otvoriť**.

            Výsledky sa ukladajú do priečinka **Dokumenty/DopravnaUloha**.
